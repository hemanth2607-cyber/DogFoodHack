    <rect width="220" height="30" rx="10" fill="#238636" fill-opacity="0.25" />
    <text x="14" y="20" fill="#3fb950" font-family="monospace" font-size="11" font-weight="bold">BLOCK #000 · GENESIS</text>
    
    <g transform="translate(14, 45)">
      <text x="0" y="0" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="600">PREV HASH:</text>
      <text x="0" y="15" fill="#7ee787" font-family="monospace" font-size="9.5">000000000000000000000000...</text>
      
      <text x="0" y="40" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="600">SEED PAYLOAD:</text>
      <text x="0" y="55" fill="#f0f6fc" font-family="monospace" font-size="9.5">"DOGFOOD_2026_GENESIS"</text>
      
      <text x="0" y="80" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="600">BLOCK HASH (H₀):</text>
      <rect x="0" y="88" width="192" height="24" rx="4" fill="#0d1117" stroke="#238636" stroke-width="0.8" />
      <text x="6" y="104" fill="#3fb950" font-family="monospace" font-size="9.5" font-weight="bold">7f2a9c148e0d45b2...</text>
      
      <text x="0" y="135" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">Timestamp: 2026-03-01T18:00:00Z</text>
    </g>
