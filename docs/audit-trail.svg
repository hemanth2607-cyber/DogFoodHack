      <text x="16" y="24" fill="#79c0ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="bold">AUDITOR / ORGANIZER VIEW (Full Cryptographic Disclosure)</text>
      <text x="16" y="44" fill="#8b949e" font-family="monospace" font-size="10">{"judge_id": "jdg_01", "project": "prj_12", "scores": {"func": 8, "qual": 7}, "sig": "..."}</text>
      <text x="16" y="60" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">Full provenance exposed to certified event administrators for prize validation.</text>
