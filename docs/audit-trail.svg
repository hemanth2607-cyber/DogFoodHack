      <rect x="0" y="112" width="187" height="32" rx="6" fill="#238636" fill-opacity="0.2" stroke="#238636" stroke-width="0.8" />
      <text x="12" y="132" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="bold">STATUS: AUDITED PASS</text>
