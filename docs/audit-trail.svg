      <text x="16" y="24" fill="#e3b341" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="bold">PUBLIC / PEER JUDGE VIEW (Zero-Knowledge Masked)</text>
      <text x="16" y="44" fill="#8b949e" font-family="monospace" font-size="10">{"judge_id": "MASKED_HASH_e8a2", "project": "prj_12", "status": "VERIFIED_VALID"}</text>
      <text x="16" y="60" fill="#d29922" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">Proves zero post-deadline score tampering while strictly protecting peer judge isolation.</text>
