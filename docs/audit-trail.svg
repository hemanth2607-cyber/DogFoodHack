      <text x="0" y="55" fill="#e3b341" font-family="monospace" font-size="9.5">jdg_01 → prj_12 [F:8, Q:7, I:9]</text>
      
      <text x="0" y="80" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="600">BLOCK HASH (H₁):</text>
      <rect x="0" y="88" width="192" height="24" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="0.8" />
      <text x="6" y="104" fill="#bc8cff" font-family="monospace" font-size="9.5" font-weight="bold">3a19b884d62f019c...</text>
      
      <text x="0" y="135" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">Sig: SHA256(H₀ || Record)</text>
