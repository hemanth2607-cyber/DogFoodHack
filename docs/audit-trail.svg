      <text x="0" y="40" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="600">SCORE TRANSACTION:</text>
      <text x="0" y="55" fill="#e3b341" font-family="monospace" font-size="9.5">jdg_30 → prj_41 [F:9, Q:9, I:8]</text>
      
      <text x="0" y="80" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="600">MERKLE ROOT (H₁₂₆):</text>
