<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="auto">
  <defs>
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d13" />
      <stop offset="50%" stop-color="#131922" />
      <stop offset="100%" stop-color="#090d13" />
    </linearGradient>
    <linearGradient id="badCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1619" />
      <stop offset="100%" stop-color="#1d1113" />
    </linearGradient>
    <linearGradient id="goodCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13271c" />
      <stop offset="100%" stop-color="#0e1d15" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" rx="16" fill="url(#compBg)" stroke="#30363d" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(60, 38)">
    <text x="0" y="0" fill="#f0f6fc" font-family="Georgia, serif" font-size="24" font-weight="bold">
      Why Naive Averaging Fails vs. DOGFOOD 2026 Bayesian Z-Score Normalization
    </text>
    <text x="0" y="22" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12.5">
      Mathematical Comparison: Eradicating Rater Severity Distortions &amp; Zero-Variance Divide-by-Zero Anomalies
    </text>
  </g>

  <!-- Left: Naive Arithmetic Average (Flawed) -->
  <g transform="translate(60, 85)">
    <rect width="520" height="375" rx="10" fill="url(#badCardGrad)" stroke="#f85149" stroke-width="1.2" />
    <path d="M 0 10 Q 0 0 10 0 L 510 0 Q 520 0 520 10 L 520 34 L 0 34 Z" fill="#da3633" fill-opacity="0.25" />
    <text x="18" y="23" fill="#f85149" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="bold">❌ NAIVE ARITHMETIC MEAN (Standard Hackathon Portals)</text>

    <g transform="translate(18, 50)">
      <text x="0" y="0" fill="#f0f6fc" font-family="Georgia, serif" font-size="15" font-weight="bold">Failure Mode 1: Rater Severity Bias</text>
      <text x="0" y="20" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">Harsh Judge A (μ = 4.2) vs. Ultra-Lenient Judge B (μ = 8.9)</text>
      
      <rect x="0" y="30" width="484" height="65" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="12" y="22" fill="#f85149" font-family="monospace" font-size="10.5">Project X (Judged by Harsh Rater A)  → Raw Mean: 5.2</text>
      <text x="12" y="40" fill="#e3b341" font-family="monospace" font-size="10.5">Project Y (Judged by Lenient Rater B) → Raw Mean: 8.4</text>
      <text x="12" y="56" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9.5">Result: Superior project X is unfairly disqualified simply due to judge assignment lottery.</text>

      <text x="0" y="118" fill="#f0f6fc" font-family="Georgia, serif" font-size="15" font-weight="bold">Failure Mode 2: Zero-Variance Crash (σ = 0)</text>
      <text x="0" y="138" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">Judges jdg_07 and jdg_23 give all assigned projects identical scores.</text>
      
      <rect x="0" y="148" width="484" height="60" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="12" y="22" fill="#f85149" font-family="monospace" font-size="10.5">z_score = (score - mean) / std_dev</text>
      <text x="12" y="38" fill="#f85149" font-family="monospace" font-size="10.5">std_dev == 0.0 → ZeroDivisionError: float division by zero</text>
      <text x="12" y="52" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9.5">Uncalibrated portals crash or drop entire judge cohorts from the results.</text>

      <text x="0" y="235" fill="#f0f6fc" font-family="Georgia, serif" font-size="15" font-weight="bold">Failure Mode 3: Sparse Review Distortions</text>
      <text x="0" y="255" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">Projects with 1 single score of 10.0 unfairly outrank projects with 5 scores averaging 9.4.</text>

      <rect x="0" y="270" width="484" height="35" rx="6" fill="#da3633" fill-opacity="0.15" />
      <text x="12" y="22" fill="#f85149" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="bold">OUTCOME: False podium rankings, dispute appeals &amp; unfair winner selection.</text>
    </g>
  </g>

  <!-- Right: DOGFOOD 2026 Bayesian Z-Score (Defensible) -->
  <g transform="translate(620, 85)">
    <rect width="520" height="375" rx="10" fill="url(#goodCardGrad)" stroke="#2ea043" stroke-width="1.2" />
    <path d="M 0 10 Q 0 0 10 0 L 510 0 Q 520 0 520 10 L 520 34 L 0 34 Z" fill="#238636" fill-opacity="0.25" />
    <text x="18" y="23" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="bold">✔ DOGFOOD 2026 BAYESIAN Z-SCORE ENGINE (Scientifically Calibrated)</text>

    <g transform="translate(18, 50)">
      <text x="0" y="0" fill="#f0f6fc" font-family="Georgia, serif" font-size="15" font-weight="bold">Calibration 1: Full Rater Profiling</text>
      <text x="0" y="20" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">Standardizes each review relative to the individual judge's baseline.</text>
      
      <rect x="0" y="30" width="484" height="65" rx="6" fill="#0d1117" stroke="#238636" stroke-width="0.8" />
      <text x="12" y="22" fill="#7ee787" font-family="monospace" font-size="10.5">Project X: +1.2σ above harsh judge's baseline → Calibrated: 8.6</text>
      <text x="12" y="40" fill="#8b949e" font-family="monospace" font-size="10.5">Project Y: -0.4σ below lenient judge's baseline → Calibrated: 6.8</text>
      <text x="12" y="56" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9.5">Fairness: Merit is preserved regardless of whether a team got a harsh or lenient rater.</text>

      <text x="0" y="118" fill="#f0f6fc" font-family="Georgia, serif" font-size="15" font-weight="bold">Calibration 2: Zero-Variance Protection Guard</text>
      <text x="0" y="138" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">Automated epsilon threshold handles flat raters (σ &lt; 10⁻⁵) gracefully.</text>
      
      <rect x="0" y="148" width="484" height="60" rx="6" fill="#0d1117" stroke="#238636" stroke-width="0.8" />
      <text x="12" y="22" fill="#7ee787" font-family="monospace" font-size="10.5">if std_j &lt; 1e-5: z_ij = 0.0  # Safe neutral score</text>
      <text x="12" y="38" fill="#7ee787" font-family="monospace" font-size="10.5">Tested &amp; verified on fixture raters jdg_07 and jdg_23</text>
      <text x="12" y="52" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9.5">Guarantees zero crashes, robust mathematical execution across all 30 judges.</text>

      <text x="0" y="235" fill="#f0f6fc" font-family="Georgia, serif" font-size="15" font-weight="bold">Calibration 3: Empirical Bayes Shrinkage (K = 1.0)</text>
      <text x="0" y="255" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">Shrinks low-count outliers toward grand mean μ₀ with strict 95% Confidence Bounds.</text>

      <rect x="0" y="270" width="484" height="35" rx="6" fill="#238636" fill-opacity="0.15" />
      <text x="12" y="22" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="bold">OUTCOME: Statistically defensible, uncontestable winner selection ($100 Prize).</text>
    </g>
  </g>
</svg>
