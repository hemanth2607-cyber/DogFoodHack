<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DOGFOOD 2026{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="/projects" class="brand">
        <span class="logo-badge">DOGFOOD</span>
        <span class="brand-sub">Judge Engine</span>
      </a>
      <nav class="nav-links">
        <a href="/projects" class="nav-item">Gallery</a>
        <a href="/projects/new" class="nav-item">Submit</a>
        <a href="/judge" class="nav-item">Judge View</a>
        <a href="/organizer" class="nav-item">Dashboard</a>
      </nav>
      <div class="user-pill">
        {% if user %}
          <a href="/login" class="badge role-{{ user.role }}" title="Click to switch role">{{ user.role|upper }}</a>
          <span class="username">{{ user.name }}</span>
          <a href="/logout" class="nav-item logout-link" style="margin-left: 0.5rem; font-size: 0.8rem; color: #ef4444;">Logout</a>
        {% else %}
          <a href="/login" class="btn btn-secondary" style="padding: 0.3rem 0.8rem; font-size: 0.8rem;">Switch Role / Sign In</a>
        {% endif %}
      </div>
    </div>
  </header>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer-container">
      <p>DOGFOOD 2026 &bull; Build the platform that will judge you &bull; Open Source, Zero Cloud</p>
    </div>
  </footer>
</body>
</html>
